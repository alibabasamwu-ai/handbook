<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>閱讀中 · Accio Work 專區</title>
<style>
  /* Palette sampled from accio.com/work (dark surface + mint gradient). */
  :root{
    --bg:#060A0C; --surface:#0F1416; --surface-2:#0B1012; --float:#0E1517;
    --ink:#F2F7F7; --ink-2:rgba(255,255,255,.62); --ink-3:rgba(255,255,255,.44);
    --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.07);
    --green:#03F58F; --teal:#13D0B9; --aqua:#6CDDD9; --blue:#0D83F1;
    --grad:linear-gradient(90deg,#1BE9B6 0%,#13D0AA 100%);
    --grad-brand:linear-gradient(115deg,#0D83F1 0%,#13D0B9 50%,#03F58F 100%);
    --on-brand:#0B1012;
    --r:24px; --r-sm:16px; --maxw:940px;
    --shadow:0 50px 120px -50px #000000e6;
    --glow:rgba(19,208,185,.55) 0 14px 34px -16px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);line-height:1.8;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-wrap:break-word}
  a{color:var(--teal);text-decoration:none}
  a:hover{text-decoration:underline}

  .bar{position:sticky;top:0;z-index:20;background:rgba(6,10,12,.84);
    backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:1120px;margin:0 auto;padding:11px 20px;display:flex;gap:14px;align-items:center}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;
    color:var(--ink);padding:8px 15px;border:1px solid rgba(255,255,255,.20);
    border-radius:9999px;white-space:nowrap;flex:0 0 auto;transition:.16s}
  .back:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.34);text-decoration:none}
  .bar-title{font-size:14.5px;font-weight:800;color:var(--ink);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}
  .dl{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:750;
    border-radius:9999px;padding:9px 18px;white-space:nowrap;flex:0 0 auto;transition:.16s;
    background:var(--grad);color:var(--on-brand);box-shadow:var(--glow);border:none;cursor:pointer}
  .dl:hover{filter:brightness(1.07);text-decoration:none}
  .dl.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.20);box-shadow:none}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:28px 20px 96px}
  .crumbs{font-size:12.5px;color:var(--ink-3);margin:0 0 10px;font-weight:650;letter-spacing:.02em}
  .doc-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  .pill{font-size:11.5px;font-weight:750;padding:4px 12px;border-radius:9999px;
    background:rgba(3,245,143,.12);color:var(--green);border:1px solid rgba(3,245,143,.26)}
  .pill.n{background:rgba(255,255,255,.06);color:var(--ink-3);border-color:var(--line)}
  .sources{margin:0 0 26px;padding:15px 17px;border:1px dashed var(--line);
    border-radius:var(--r-sm);background:var(--surface);font-size:13px}
  .sources b{display:block;font-size:12px;letter-spacing:.06em;color:var(--ink-3);margin-bottom:9px}
  .sources a{display:inline-block;margin:2px 14px 2px 0;font-weight:700}

  .prose{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:38px 42px;box-shadow:var(--shadow)}
  .prose h2,.prose h3,.prose h4,.prose h5,.prose h6{line-height:1.35;color:var(--ink);
    margin:1.7em 0 .55em;font-weight:800}
  .prose h2{font-size:23px;padding-bottom:10px;border-bottom:2px solid var(--teal)}
  .prose h3{font-size:18.5px;color:var(--aqua)}
  .prose h4{font-size:16.5px}
  .prose h5,.prose h6{font-size:15px;color:var(--ink-2)}
  .prose h2:first-child,.prose h3:first-child,.prose p:first-child{margin-top:0}
  .prose p{margin:.66em 0;color:var(--ink-2)}
  .prose strong{color:var(--ink);font-weight:800}
  .prose ul,.prose ol{margin:.62em 0 .95em;padding-left:1.5em;color:var(--ink-2)}
  .prose li{margin:.3em 0}
  .prose blockquote{margin:1.1em 0;padding:14px 19px;border-left:3px solid var(--teal);
    background:rgba(19,208,185,.07);color:var(--ink-2);border-radius:0 14px 14px 0}
  .prose code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:.9em;
    background:rgba(255,255,255,.08);color:var(--aqua);padding:2px 7px;border-radius:7px}
  .prose pre{background:var(--surface-2);color:#DCE7E5;padding:17px 19px;border-radius:14px;
    border:1px solid var(--line-2);overflow-x:auto;font-size:13px;line-height:1.68}
  .prose pre code{background:none;color:inherit;padding:0}

  .tbl-wrap{overflow-x:auto;margin:1.15em 0;border:1px solid var(--line);border-radius:14px}
  .prose table{border-collapse:collapse;width:100%;font-size:14px;min-width:420px}
  .prose th,.prose td{border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2);
    padding:11px 14px;text-align:left;vertical-align:top}
  .prose th{background:rgba(255,255,255,.05);font-weight:800;color:var(--ink);white-space:nowrap}
  .prose tr:last-child td{border-bottom:none}
  .prose td:last-child,.prose th:last-child{border-right:none}

  .prose figure{margin:1.35em 0;text-align:center}
  .prose img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:14px;background:#fff}

  .fm{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;
    padding:14px 17px;margin:0 0 22px;font-size:13.5px}
  .fm b{display:block;color:var(--green);font-size:14.5px}
  .fm p{margin:6px 0 0;color:var(--ink-2)}

  .toc{background:rgba(19,208,185,.06);border:1px solid var(--line);border-radius:14px;
    padding:15px 18px;margin:0 0 28px;font-size:13.5px}
  .toc b{display:block;color:var(--teal);margin-bottom:9px;font-size:13px}
  .toc div{display:flex;flex-wrap:wrap;gap:6px}
  .toc a{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:9999px;
    padding:5px 12px;font-weight:650;font-size:12.5px}

  .bpart{margin:0 0 38px;padding-top:8px}
  .bpart-h{font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--ink-3);
    border-bottom:1px dashed var(--line);padding-bottom:8px;margin:0 0 15px}
  .filelist{list-style:none;padding:0;margin:0;font-size:13.5px}
  .filelist li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--line-2);color:var(--ink-2)}
  .kb{color:var(--ink-3);font-size:12px;white-space:nowrap}

  iframe.pdf{width:100%;height:78vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
  .state{padding:44px 20px;text-align:center;color:var(--ink-2);font-size:14px}
  .warn{color:#FF8A6B;font-size:13px}
  .foot{margin:36px 0 0;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink-3);text-align:center}

  @media (max-width:720px){
    .wrap{padding:20px 14px 72px}
    .prose{padding:24px 18px}
    .bar-in{padding:10px 13px;gap:9px}
    .bar-title{display:none}
    .prose h2{font-size:20px}
    iframe.pdf{height:66vh}
  }
  @media print{
    .bar,.sources,.foot{display:none}
    body{background:#fff;color:#000}
    .prose{border:none;box-shadow:none;padding:0;background:#fff}
  }
</style>
</head>
<body>
<div class="bar">
  <div class="bar-in">
    <a class="back" id="backLink" href="../#/accio"><span>&larr;</span> <span id="backText">Accio Work 專區</span></a>
    <div class="bar-title" id="barTitle">載入中…</div>
    <a class="dl" id="dlMain" href="#" download>下載原檔</a>
  </div>
</div>

<div class="wrap">
  <div class="crumbs" id="crumbs"></div>
  <div class="doc-meta" id="meta"></div>
  <div id="mount"><div class="state">載入中…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script>
(function(){
  var qs = new URLSearchParams(location.search);
  var id = qs.get('d');
  var isCN = qs.get('v') === 'cn';
  var mount = document.getElementById('mount');
  var T = isCN ? {
      back:'Accio Work 专区', dl:'下载原档', zip:'下载技能包 (.zip)', src:'可下载的原始文件',
      fail:'加载失败：', nodoc:'没有指定文件。', noitem:'找不到这份文件', skill:'技能包',
      noread:'此项目没有可在线阅读的内容，请直接下载。',
      foot:'本页由「国际站营运手册」的 Accio Work 专区产生 · 内容版权属原作者'
    } : {
      back:'Accio Work 專區', dl:'下載原檔', zip:'下載技能包 (.zip)', src:'可下載的原始檔案',
      fail:'載入失敗：', nodoc:'沒有指定文件。', noitem:'找不到這份文件', skill:'技能包',
      noread:'此項目沒有可線上閱讀的內容，請直接下載。',
      foot:'本頁由「國際站營運全鏈路手冊」的 Accio Work 專區產生 · 內容版權屬原作者'
    };
  if (isCN) document.documentElement.lang = 'zh-Hans';
  document.getElementById('backText').textContent = T.back;
  document.getElementById('foot').textContent = T.foot;
  document.getElementById('dlMain').textContent = T.dl;
  document.getElementById('backLink').href = isCN ? '../zh-CN.html#/accio' : '../#/accio';

  function fail(msg){
    mount.innerHTML = '<div class="state">' + msg + '<br><br>' +
      '<a class="dl ghost" style="display:inline-flex" href="' +
      document.getElementById('backLink').href + '">' + T.back + '</a></div>';
  }
  if(!id){ fail(T.nodoc); return; }

  fetch('manifest.json', {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('manifest ' + r.status); return r.json(); })
    .then(function(man){
      var it = null;
      for(var i=0;i<man.items.length;i++){ if(man.items[i].id === id){ it = man.items[i]; break; } }
      if(!it) throw new Error(T.noitem);

      var label = (isCN ? it.label_cn : it.label) || it.label;
      var reader = isCN ? (it.reader_cn || it.reader) : it.reader;
      document.title = label + ' · Accio Work';
      document.getElementById('barTitle').textContent = label;

      var cat = man.categories.filter(function(c){ return c.id === it.cat; })[0];
      var catName = cat ? (isCN && cat.name_cn ? cat.name_cn : cat.name) : '';
      document.getElementById('crumbs').textContent = T.back + ' ／ ' + catName;

      var pills = ['<span class="pill">' + (it.meta || '') + '</span>'];
      if(it.kb) pills.push('<span class="pill n">' + it.kb + ' KB</span>');
      if(it.is_skill) pills.push('<span class="pill n">' + T.skill + '</span>');
      document.getElementById('meta').innerHTML = pills.join('');

      var main = document.getElementById('dlMain');
      if(it.zip){ main.href = it.zip; main.textContent = T.zip; main.setAttribute('download',''); }
      else if(it.dl && it.dl.length){ main.href = it.dl[0].url; main.setAttribute('download',''); }

      var src = '';
      if(it.dl && it.dl.length){
        src = '<div class="sources"><b>' + T.src + '</b>' +
          it.dl.map(function(f){
            return '<a href="' + f.url + '" download>' + f.name + ' <span class="kb">' +
                   f.kb + ' KB</span></a>';
          }).join('') + '</div>';
      }

      if(it.embed){
        mount.innerHTML = src + '<iframe class="pdf" src="' + it.embed + '#view=FitH" title="' + label + '"></iframe>';
        return;
      }
      if(!reader){
        mount.innerHTML = src + '<div class="state">' + T.noread + '</div>';
        return;
      }
      fetch(reader, {cache:'no-store'})
        .then(function(r){ if(!r.ok) throw new Error('reader ' + r.status); return r.text(); })
        .then(function(body){
          mount.innerHTML = src + '<article class="prose">' + body + '</article>';
          mount.querySelectorAll('.toc a').forEach(function(a){
            a.addEventListener('click', function(e){
              var t = mount.querySelector(a.getAttribute('href'));
              if(t){ e.preventDefault(); t.scrollIntoView({behavior:'smooth', block:'start'}); }
            });
          });
        })
        .catch(function(e){ fail(T.fail + e.message); });
    })
    .catch(function(e){ fail(T.fail + e.message); });
})();
</script>
</body>
</html>
